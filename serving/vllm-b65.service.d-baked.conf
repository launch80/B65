# Serve the baked checkpoint (Launch80/Qwen3.8-27B-GPTQ-Int4-baked) instead of the
# patched stock one. serve-baked.sh encodes the flags the baked model needs (no
# B70_MTP_BF16_DRAFT, R3/M1 off - both are on disk). Remove this file and
# daemon-reload to fall back to serve-b65.sh and the stock checkpoint.
[Service]
ExecStart=
ExecStart=/home/thelab/Documents/project608/research/bake/serve-baked.sh
Environment=BAKED=/home/thelab/bake-model
Environment=PORT=8000
Environment=NAME=vllm-b65
Environment=SPEC=6
